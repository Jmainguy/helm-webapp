name: Release Helm Chart

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: Jmainguy/helm-workflows/.github/workflows/helm-release.yml@v1.1.0
    secrets:
      # zot.soh.re uses the same OCI credentials as container images.
      helm_username: ${{ secrets.DOCKER_USERNAME }}
      helm_password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      helm_registry: zot.soh.re
      chart_name: "webapp"
      chart_path: "."
